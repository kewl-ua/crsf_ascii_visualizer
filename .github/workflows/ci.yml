name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Run protocol, socket, CLI and real-terminal tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check that both distributions contain the manual
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          with zipfile.ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              assert any(name.endswith('share/man/man1/crsf-viz.1') for name in wheel.namelist())
          with tarfile.open(next(Path('dist').glob('*.tar.gz'))) as source:
              assert any(name.endswith('/man/crsf-viz.1') for name in source.getnames())
          PY
      - name: Install and exercise the wheel outside the checkout
        shell: bash
        run: |
          expected_version="$(python -c 'from crsf_ascii_visualizer import __version__; print(__version__)')"
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[serial]"
          cd "$RUNNER_TEMP"
          crsf-viz --help
          test "$(crsf-viz --version)" = "crsf-viz $expected_version"
          python -c "import sys, crsf_ascii_visualizer; assert crsf_ascii_visualizer.__version__ == sys.argv[1]" "$expected_version"
      - name: Install man-page rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y groff-base man-db
      - name: Stage the Linux install and render the manual
        shell: bash
        run: |
          expected_version="$(python -c 'from crsf_ascii_visualizer import __version__; print(__version__)')"
          stage="$RUNNER_TEMP/crsf-stage-${{ matrix.python }}"
          make install PREFIX=/usr/local DESTDIR="$stage" PYTHON="$(command -v python)"
          test "$("$stage/usr/local/bin/crsf-viz" --version)" = "crsf-viz $expected_version"
          test -f "$stage/usr/local/share/man/man1/crsf-viz.1"
          groff -man -Tutf8 "$stage/usr/local/share/man/man1/crsf-viz.1" > "$RUNNER_TEMP/crsf-viz-man.txt"
          test -s "$RUNNER_TEMP/crsf-viz-man.txt"
          MANPATH="$stage/usr/local/share/man:" man -w crsf-viz
          make uninstall PREFIX=/usr/local DESTDIR="$stage"
          test ! -e "$stage/usr/local/bin/crsf-viz"
          test ! -e "$stage/usr/local/share/man/man1/crsf-viz.1"
