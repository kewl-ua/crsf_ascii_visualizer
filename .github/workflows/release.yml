name: Release

on:
  push:
    branches: [master]
    paths: ['crsf_ascii_visualizer/__init__.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish Linux release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install build and manual tools
        run: |
          python -m pip install --upgrade build
          sudo apt-get update
          sudo apt-get install -y groff-base man-db
      - name: Build and verify release packages
        run: python scripts/build_release.py --out dist
      - name: Verify the Debian install
        shell: bash
        run: |
          sudo apt-get install -y ./dist/*_all.deb
          crsf-viz --help
          version="$(python -c 'from crsf_ascii_visualizer import __version__; print(__version__)')"
          test "$(crsf-viz --version)" = "crsf-viz $version"
          man -w crsf-viz
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(python -c 'from crsf_ascii_visualizer import __version__; print(__version__)')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its assets."
            exit 0
          fi
          gh release create "$tag" dist/*.whl dist/*.tar.gz dist/*.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "CRSF ASCII Visualizer $tag" \
            --notes-file "docs/releases/$tag.md" --latest
