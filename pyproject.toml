[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crsf-ascii-visualizer"
dynamic = ["version"]
description = "Terminal visualizer for CRSF RC channels over UART, UDP and UNIX sockets"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["crsf", "radio-control", "fpv", "terminal", "curses", "serial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
crsf-viz = "crsf_ascii_visualizer.cli:run"

[project.urls]
Repository = "https://github.com/kewl-ua/crsf_ascii_visualizer"
Issues = "https://github.com/kewl-ua/crsf_ascii_visualizer/issues"

[tool.setuptools]
packages = ["crsf_ascii_visualizer"]

[tool.setuptools.dynamic]
version = {attr = "crsf_ascii_visualizer.__version__"}

[tool.setuptools.data-files]
"share/man/man1" = ["man/crsf-viz.1"]
